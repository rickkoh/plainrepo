name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    if: ${{ github.repository_owner == 'rickkoh' }}

    runs-on: ubuntu-latest

    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "PlainRepo ${GITHUB_REF_NAME#v}" \
              --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
          fi

  publish:
    needs: create-release

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder's DMG step runs 'python', which macOS doesn't provide
      - name: Install Python for DMG creation
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install additional dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: npm install --no-save minimatch@5.1.0

      - name: Build and package
        run: |
          npm run build
          npx electron-builder build ${{ matrix.platform }} --publish never

      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: node .erb/scripts/smoke-test.js

      - name: Smoke test packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node .erb/scripts/smoke-test.js

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/build/*-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter PlainRepo.exe | Select-Object -First 1
          if (-not $app) { throw 'PlainRepo.exe was not installed' }
          node .erb/scripts/smoke-test.js $app.FullName

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/build/*.{dmg,zip,exe,AppImage,blockmap} \
            release/build/latest*.yml
